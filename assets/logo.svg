<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" class="senshi-logo-svg">
  <defs>
    <linearGradient id="senshiRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="katanaGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF3366" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Hex Shield Boundary -->
  <polygon points="60,6 104,26 104,74 60,114 16,74 16,26" fill="#0E131F" stroke="url(#senshiRedGrad)" stroke-width="2.5" filter="url(#crimsonGlow)"/>

  <!-- Inner Kabuto / Origami Helmet Facets -->
  <!-- Central Crest (Maedate) -->
  <polygon points="60,20 68,38 60,34 52,38" fill="url(#senshiRedGrad)" opacity="0.9"/>
  
  <!-- Horns / Crest Wings -->
  <path d="M60 34 L82 18 L76 38 L68 38 Z" fill="url(#senshiRedGrad)"/>
  <path d="M60 34 L38 18 L44 38 L52 38 Z" fill="url(#senshiRedGrad)"/>

  <!-- Main Visor (Menpo Shield Line) -->
  <polygon points="60,54 84,44 78,64 60,78 42,64 36,44" fill="#141B2D" stroke="url(#senshiRedGrad)" stroke-width="2"/>

  <!-- Origami Katana Blade Line Intersection -->
  <path d="M28 88 L92 24" stroke="url(#katanaGlow)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M36 96 L24 84" stroke="url(#senshiRedGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Core Diamond Crystal of Protection -->
  <polygon points="60,58 67,67 60,76 53,67" fill="#FF3366" filter="url(#crimsonGlow)"/>

  <!-- Center Axis Division -->
  <line x1="60" y1="34" x2="60" y2="108" stroke="url(#senshiRedGrad)" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5"/>
</svg>
