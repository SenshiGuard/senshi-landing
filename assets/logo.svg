<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" class="senshi-guard-logo">
  <defs>
    <!-- Cyber Crimson Neon Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Gradients -->
    <linearGradient id="neonCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C8A" />
      <stop offset="50%" stop-color="#FF2A5F" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="katanaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A5F" />
      <stop offset="100%" stop-color="#FFA8C2" />
    </linearGradient>
  </defs>

  <!-- Group with Neon Filter & Cyber Red Lines -->
  <g stroke="url(#neonCrimson)" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
    
    <!-- 1. DIAGONAL KATANA BLADE (Crossed behind shield) -->
    <path d="M 330 145 L 410 75 L 395 65 L 320 130" stroke-width="6" fill="none" />
    <path d="M 175 355 L 105 425 L 90 415 L 160 345" stroke-width="6" fill="none" />
    <line x1="95" y1="410" x2="115" y2="430" stroke-width="5" />

    <!-- 2. BACKGROUND SHIELD (Outer Protective Frame) -->
    <path d="M 175 140 L 250 95 L 325 140 L 325 240 L 250 375 L 175 240 Z" stroke-width="8" fill="#0A0E17" fill-opacity="0.85" />
    <path d="M 195 155 L 250 120 L 305 155 L 305 230 L 250 345 L 195 230 Z" stroke-width="4" fill="none" opacity="0.6" />
    <line x1="250" y1="120" x2="250" y2="345" stroke-width="4" opacity="0.7" />

    <!-- 3. SAMURAI KABUTO (Kuwagata Horns - Upward V-flare) -->
    <path d="M 235 210 L 155 90 L 190 120 L 220 185" stroke-width="8" fill="#0A0E17" fill-opacity="0.9" />
    <path d="M 155 90 L 180 85 L 235 200" stroke-width="6" fill="none" />

    <path d="M 265 210 L 345 90 L 310 120 L 280 185" stroke-width="8" fill="#0A0E17" fill-opacity="0.9" />
    <path d="M 345 90 L 320 85 L 265 200" stroke-width="6" fill="none" />

    <!-- Central Horn Crest Diamond (Maedate) -->
    <polygon points="250,175 268,205 250,230 232,205" stroke-width="6" fill="#130810" />
    <polygon points="250,188 258,205 250,218 242,205" stroke-width="3" fill="url(#neonCrimson)" />

    <!-- 4. HELMET BROW & VISOR (Menpo / Forehead Plate) -->
    <path d="M 195 215 L 250 240 L 305 215" stroke-width="8" fill="none" />
    
    <!-- Mask / Cheek Plate Left (Fukigaeshi Wing) -->
    <path d="M 195 215 L 135 255 L 165 315 L 205 260" stroke-width="7" fill="#0A0E17" fill-opacity="0.9" />
    <line x1="145" y1="265" x2="175" y2="305" stroke-width="4" opacity="0.6" />

    <!-- Mask / Cheek Plate Right (Fukigaeshi Wing) -->
    <path d="M 305 215 L 365 255 L 335 315 L 295 260" stroke-width="7" fill="#0A0E17" fill-opacity="0.9" />
    <line x1="355" y1="265" x2="325" y2="305" stroke-width="4" opacity="0.6" />

    <!-- 5. LOWER VISOR / CHIN GUARD (Surgical Point) -->
    <path d="M 205 260 L 250 310 L 295 260 L 250 280 Z" stroke-width="7" fill="#130810" />
    <line x1="250" y1="280" x2="250" y2="310" stroke-width="4" />

  </g>
</svg>
